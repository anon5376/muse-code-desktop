name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Assert Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install Muse CLI (official installer)
        run: |
          if curl -fsSL https://dev.meta.ai/install.sh | sh; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::Muse CLI install failed; Muse-dependent tests will be skipped"
          fi

      - name: Build release app
        run: bash scripts/build-app.sh release

      - name: Run tests
        run: bash scripts/test-ci.sh

      - name: Package and verify DMG
        run: bash scripts/package-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muse-Code-Desktop-0.1.0-arm64
          path: build/dist/
          retention-days: 7
          if-no-files-found: error
